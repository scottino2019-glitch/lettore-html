<!doctype html>
<html lang="it">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ideogrammi Interattivi</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100%;
            color: #2d3748;
        }

        html {
            height: 100%;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .game-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #e53e3e, #dd6b20, #f6ad55);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-text {
            font-size: 1.2rem;
            color: #4a5568;
            margin-bottom: 20px;
        }

        .game-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border: 3px solid transparent;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            border-color: #e53e3e;
        }

        .game-card.active {
            border-color: #e53e3e;
            background: rgba(229, 62, 62, 0.1);
        }

        .game-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .game-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2d3748;
        }

        .game-description {
            font-size: 1rem;
            color: #718096;
            line-height: 1.5;
        }

        .game-area {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .game-area.active {
            display: block;
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            border-radius: 15px;
            border-left: 5px solid #e53e3e;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #e53e3e;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* GIOCO INDOVINA */
        .guess-game {
            text-align: center;
        }

        .question-card {
            background: #f7fafc;
            padding: 40px;
            border-radius: 20px;
            margin: 30px 0;
            border-left: 5px solid #e53e3e;
        }

        .meaning-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 20px;
        }

        .pronunciation-hint {
            font-size: 1.3rem;
            color: #718096;
            font-style: italic;
            margin-bottom: 10px;
        }

        .context-hint {
            font-size: 1.1rem;
            color: #4a5568;
            background: rgba(229, 62, 62, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .option-card {
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .option-card:hover {
            border-color: #e53e3e;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .option-character {
            font-size: 5rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .option-pinyin {
            font-size: 1.2rem;
            color: #718096;
            font-style: italic;
        }

        .option-card.correct {
            border-color: #38a169;
            background: rgba(56, 161, 105, 0.1);
            animation: correctPulse 0.8s ease;
        }

        .option-card.incorrect {
            border-color: #e53e3e;
            background: rgba(229, 62, 62, 0.1);
            animation: shake 0.5s ease;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* GIOCO MEMORY */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 30px 0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .memory-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.6s ease;
            transform-style: preserve-3d;
            position: relative;
        }

        .memory-card.flipped {
            transform: rotateY(180deg);
        }

        .memory-card.matched {
            opacity: 0.6;
            pointer-events: none;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .card-back {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 2rem;
        }

        .card-front {
            background: white;
            transform: rotateY(180deg);
            border: 3px solid #e2e8f0;
        }

        .card-character {
            font-size: 3rem;
            font-weight: bold;
            color: #2d3748;
        }

        .card-meaning {
            font-size: 1.1rem;
            color: #718096;
            text-align: center;
            padding: 10px;
        }

        /* GIOCO DISEGNO */
        .drawing-game {
            text-align: center;
        }

        .character-display {
            font-size: 8rem;
            color: #e53e3e;
            margin: 30px 0;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.2);
        }

        .drawing-canvas {
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            margin-left: 0px;
            margin-right: 250px;
            display: block;
            background: white;
            cursor: crosshair;
            width: 290px;
            height: 300px
        }

        .stroke-guide {
            background: #f7fafc;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .character-info {
            text-align: center;
            padding: 20px;
        }

        .char-meaning {
            font-size: 2rem;
            font-weight: bold;
            color: #e53e3e;
            margin-bottom: 10px;
        }

        .char-context {
            font-size: 1.2rem;
            color: #4a5568;
            font-style: italic;
        }

        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 150px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #e53e3e, #dd6b20);
            color: white;
            box-shadow: 0 5px 15px rgba(229, 62, 62, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(229, 62, 62, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }

        .feedback {
            text-align: center;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-size: 1.3rem;
            font-weight: 600;
            display: none;
        }

        .feedback.correct {
            background: rgba(56, 161, 105, 0.1);
            color: #38a169;
            border: 2px solid #38a169;
        }

        .feedback.incorrect {
            background: rgba(229, 62, 62, 0.1);
            color: #e53e3e;
            border: 2px solid #e53e3e;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .game-title {
                font-size: 2.2rem;
            }
            
            .options-grid {
                grid-template-columns: 1fr;
            }
            
            .memory-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .character-display {
                font-size: 6rem;
            }
        }
    </style>

 </head>
 <body>
  <div class="container">
   <header class="header">
    <h1 class="game-title" id="gameTitle">🎯 Ideogrammi Interattivi</h1>
    <p class="welcome-text" id="welcomeMessage">Impara gli ideogrammi cinesi con giochi divertenti e intuitivi!</p>
   </header><!-- Gioco Disegno -->
   <div class="game-area active" id="drawGame">
    <div class="game-stats">
     <div class="stat-item"><span class="stat-value" id="drawCompleted">0</span> <span class="stat-label">Completati</span>
     </div>
     <div class="stat-item"><span class="stat-value" id="drawAccuracy">0%</span> <span class="stat-label">Precisione</span>
     </div>
     <div class="stat-item"><span class="stat-value" id="drawStrokes">0</span> <span class="stat-label">Tratti</span>
     </div>
    </div>
    <div class="drawing-game">
     <div class="character-display" id="drawCharacter">
      人
     </div>
     <div class="stroke-guide">
      <h3>Usa la "Guida" per vedere il carattere trasparente sul canvas:</h3>
      <div class="character-info" id="characterInfo">
       <div class="char-meaning">
        人 = persona (rén)
       </div>
       <div class="char-context">
        👤 Essere umano, individuo
       </div>
      </div>
     </div>
     <canvas id="drawingCanvas" class="drawing-canvas" width="300" height="300"></canvas>
     <div class="control-buttons"><button class="btn btn-secondary" id="clearCanvasBtn">🗑️ Cancella</button> <button class="btn btn-secondary" id="showGuideBtn">👁️ Guida</button> <button class="btn btn-primary" id="nextDrawBtn">➡️ Prossimo</button>
     </div>
    </div>
   </div>
  </div>
  <script>
        // Configurazione predefinita
        const defaultConfig = {
            game_title: "🎯 Ideogrammi Interattivi",
            welcome_message: "Impara gli ideogrammi cinesi con giochi divertenti e intuitivi!",
            start_button_text: "🚀 Inizia",
            level_label: "Livello"
        };

        // Database degli ideogrammi con contesti
        const ideograms = [
            { 
                char: '人', 
                pinyin: 'rén', 
                meaning: 'persona', 
                context: '👤 Essere umano, individuo',
                strokes: [
                    'M80 40 L100 120',
                    'M120 40 L100 120'
                ]
            },
            { 
                char: '大', 
                pinyin: 'dà', 
                meaning: 'grande', 
                context: '📏 Di dimensioni ampie, importante',
                strokes: [
                    'M100 30 L100 120',
                    'M70 60 L130 60'
                ]
            },
            { 
                char: '小', 
                pinyin: 'xiǎo', 
                meaning: 'piccolo', 
                context: '🔍 Di dimensioni ridotte, giovane',
                strokes: [
                    'M100 40 L100 80',
                    'M80 60 L120 60',
                    'M90 100 L110 100'
                ]
            },
            { 
                char: '山', 
                pinyin: 'shān', 
                meaning: 'montagna', 
                context: '⛰️ Elevazione naturale del terreno',
                strokes: [
                    'M100 30 L100 100',
                    'M70 60 L70 100',
                    'M130 60 L130 100',
                    'M60 100 L140 100'
                ]
            },
            { 
                char: '日', 
                pinyin: 'rì', 
                meaning: 'sole', 
                context: '☀️ Stella che illumina la Terra',
                strokes: [
                    'M70 40 L130 40',
                    'M130 40 L130 100',
                    'M130 100 L70 100',
                    'M70 100 L70 40',
                    'M70 70 L130 70'
                ]
            },
            { 
                char: '月', 
                pinyin: 'yuè', 
                meaning: 'luna', 
                context: '🌙 Satellite naturale della Terra',
                strokes: [
                    'M70 40 L70 120',
                    'M70 40 L120 40',
                    'M120 40 L120 120',
                    'M70 70 L120 70',
                    'M70 100 L120 100'
                ]
            },
            { 
                char: '水', 
                pinyin: 'shuǐ', 
                meaning: 'acqua', 
                context: '💧 Elemento liquido essenziale per la vita',
                strokes: [
                    'M100 30 L100 50',
                    'M80 60 L120 60',
                    'M70 80 L100 120',
                    'M130 80 L100 120'
                ]
            },
            { 
                char: '火', 
                pinyin: 'huǒ', 
                meaning: 'fuoco', 
                context: '🔥 Elemento che brucia e produce calore',
                strokes: [
                    'M100 30 L100 80',
                    'M80 50 L120 50',
                    'M70 80 L100 120',
                    'M130 80 L100 120'
                ]
            },
            { 
                char: '木', 
                pinyin: 'mù', 
                meaning: 'legno', 
                context: '🌳 Materiale degli alberi, natura',
                strokes: [
                    'M100 30 L100 120',
                    'M70 80 L130 80'
                ]
            },
            { 
                char: '土', 
                pinyin: 'tǔ', 
                meaning: 'terra', 
                context: '🌍 Suolo, terreno, pianeta',
                strokes: [
                    'M100 50 L100 90',
                    'M70 70 L130 70',
                    'M60 100 L140 100'
                ]
            }
        ];

        // Stati dei giochi
        let gameStates = {
            guess: { score: 0, streak: 0, level: 1, currentQuestion: 0, answered: false },
            memory: { score: 0, moves: 0, matches: 0, flippedCards: [], matchedPairs: [] },
            draw: { completed: 0, accuracy: 0, strokes: 0, currentChar: 0, isDrawing: false }
        };

        // Inizializzazione
        document.addEventListener('DOMContentLoaded', function() {
            initializeEventListeners();
            
            // Inizializza SDK se disponibile
            if (window.elementSdk) {
                window.elementSdk.init({
                    defaultConfig: defaultConfig,
                    onConfigChange: updateUI,
                    mapToCapabilities: () => ({
                        recolorables: [],
                        borderables: [],
                        fontEditable: undefined,
                        fontSizeable: undefined
                    }),
                    mapToEditPanelValues: (config) => new Map([
                        ["game_title", config.game_title || defaultConfig.game_title],
                        ["welcome_message", config.welcome_message || defaultConfig.welcome_message],
                        ["start_button_text", config.start_button_text || defaultConfig.start_button_text],
                        ["level_label", config.level_label || defaultConfig.level_label]
                    ])
                });
            }
        });

        function updateUI(config) {
            const gameTitle = document.getElementById('gameTitle');
            const welcomeMessage = document.getElementById('welcomeMessage');
            const levelLabel = document.getElementById('levelLabel');

            if (gameTitle) gameTitle.textContent = config.game_title || defaultConfig.game_title;
            if (welcomeMessage) welcomeMessage.textContent = config.welcome_message || defaultConfig.welcome_message;
            if (levelLabel) levelLabel.textContent = config.level_label || defaultConfig.level_label;
        }

        function initializeEventListeners() {
            // Draw game
            document.getElementById('nextDrawBtn').addEventListener('click', nextDrawCharacter);
            document.getElementById('clearCanvasBtn').addEventListener('click', clearCanvas);
            document.getElementById('showGuideBtn').addEventListener('click', showDrawingGuide);

            
            initializeDrawingCanvas();
            initializeDrawGame();
        }



        // GIOCO DISEGNO
        function initializeDrawGame() {
            gameStates.draw = { completed: 0, accuracy: 0, strokes: 0, currentChar: 0, isDrawing: false };
            loadDrawCharacter();
            updateDrawStats();
        }

        function initializeDrawingCanvas() {
            const canvas = document.getElementById('drawingCanvas');
            const ctx = canvas.getContext('2d');
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            
            // Touch events per mobile
            canvas.addEventListener('touchstart', handleTouch);
            canvas.addEventListener('touchmove', handleTouch);
            canvas.addEventListener('touchend', stopDrawing);
            
            function startDrawing(e) {
                isDrawing = true;
                [lastX, lastY] = getMousePos(e);
                gameStates.draw.strokes++;
                updateDrawStats();
            }
            
            function draw(e) {
                if (!isDrawing) return;
                
                const [currentX, currentY] = getMousePos(e);
                
                ctx.strokeStyle = '#e53e3e';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
                
                [lastX, lastY] = [currentX, currentY];
            }
            
            function stopDrawing() {
                isDrawing = false;
            }
            
            function getMousePos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                return [
                    clientX - rect.left,
                    clientY - rect.top
                ];
            }
            
            function handleTouch(e) {
                e.preventDefault();
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : 
                                                 e.type === 'touchmove' ? 'mousemove' : 'mouseup', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                canvas.dispatchEvent(mouseEvent);
            }
        }

        function loadDrawCharacter() {
            const char = ideograms[gameStates.draw.currentChar % ideograms.length];
            document.getElementById('drawCharacter').textContent = char.char;
            
            // Aggiorna le informazioni del carattere
            const characterInfo = document.getElementById('characterInfo');
            characterInfo.innerHTML = `
                <div class="char-meaning">${char.char} = ${char.meaning} (${char.pinyin})</div>
                <div class="char-context">${char.context}</div>
            `;
        }



        function clearCanvas() {
            const canvas = document.getElementById('drawingCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            gameStates.draw.strokes = 0;
            updateDrawStats();
        }

        function showDrawingGuide() {
            const char = ideograms[gameStates.draw.currentChar % ideograms.length];
            const canvas = document.getElementById('drawingCanvas');
            const ctx = canvas.getContext('2d');
            
            // Mostra guida trasparente
            ctx.globalAlpha = 0.3;
            ctx.font = '300px Arial';
            ctx.fillStyle = '#cbd5e0';
            ctx.textAlign = 'center';
            ctx.fillText(char.char, canvas.width/2, canvas.height*0.8);
            ctx.globalAlpha = 1.0;
        }

        function nextDrawCharacter() {
            gameStates.draw.currentChar++;
            gameStates.draw.completed++;
            
            // Calcola precisione simulata
            const expectedStrokes = ideograms[gameStates.draw.currentChar % ideograms.length].strokes.length;
            const accuracy = Math.max(0, 100 - Math.abs(gameStates.draw.strokes - expectedStrokes) * 10);
            gameStates.draw.accuracy = Math.round((gameStates.draw.accuracy + accuracy) / 2);
            
            clearCanvas();
            loadDrawCharacter();
            updateDrawStats();
            
            showFeedback(`Carattere completato! Precisione: ${accuracy}%`, accuracy > 70 ? 'correct' : 'incorrect');
        }

        function updateDrawStats() {
            document.getElementById('drawCompleted').textContent = gameStates.draw.completed;
            document.getElementById('drawAccuracy').textContent = gameStates.draw.accuracy + '%';
            document.getElementById('drawStrokes').textContent = gameStates.draw.strokes;
        }

        // Utility functions
        function showFeedback(message, type) {
            // Crea feedback temporaneo
            const feedback = document.createElement('div');
            feedback.textContent = message;
            feedback.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: ${type === 'correct' ? '#38a169' : '#e53e3e'};
                color: white;
                padding: 20px 40px;
                border-radius: 15px;
                font-size: 1.3rem;
                font-weight: bold;
                z-index: 1000;
                animation: fadeInOut 3s ease;
            `;
            
            document.body.appendChild(feedback);
            setTimeout(() => feedback.remove(), 3000);
        }

        // Aggiungi stili per l'animazione
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInOut {
                0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
                20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                100% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            }
        `;
        document.head.appendChild(style);
